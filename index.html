<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zenvora</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #07101f;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }

    .box {
      max-width: 700px;
      padding: 40px 24px;
    }

    h1 {
      font-size: 56px;
      margin-bottom: 10px;
    }

    p {
      font-size: 20px;
      color: #b8c3d9;
      line-height: 1.6;
    }

    .accent {
      color: #27d7ff;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>ZENVORA</h1>
    <p class="accent">Websites • AI • Automation</p>
    <p>
      Tworzymy nowoczesne strony internetowe i automatyzacje AI dla firm.
    </p>
  </div>
</body>
</html>
